<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Média Alunos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        background-color: #ddd;
      }

      .header {
        padding: 1rem;
        text-align: center;
      }

      .content {
        background-color: #7f7f7f;
        padding: 1rem;
        margin: 1rem 2rem;
        text-align: center;
        border-radius: 0.875rem;
      }

      .aprovado {
        color: #006d2c;
      }

      .reprovado {
        color: #99000d;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Média Alunos</h1>
    </div>
    <div id="container"></div>
    <script type="module">
      import { alunos } from './alunos.js';

      const container = document.getElementById('container');

      container.innerHTML = alunos
        .map((aluno) => {
          const soma = aluno.notas.reduce((acc, nota) => acc + nota, 0);
          const media = soma / aluno.notas.length;

          return `
          <div class="content">
            <p><strong>Aluno(a):</strong> ${aluno.nome} ${aluno.sobrenome}</p>
            <p><strong>Notas:</strong> ${aluno.notas.join(', ')}</p>
            <p><strong>Média:</strong> ${media.toFixed(1).replace('.', ',')}</p>
            <p><strong>Situação:</strong> ${media >= 6 ? '<span class="aprovado">Aprovado</span>' : '<span class="reprovado">Reprovado</span>'}</p>
          </div>
        `;
        })
        .join(' ');
    </script>
  </body>
</html>
