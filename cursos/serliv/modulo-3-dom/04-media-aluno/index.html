<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Média Aluno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue',
          sans-serif;
        background-color: #ddd;
      }

      .header {
        padding: 1rem;
        text-align: center;
      }

      .content {
        background-color: #7f7f7f;
        padding: 1rem;
        margin: 1rem 2rem;
        text-align: center;
        border-radius: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Média Aluno</h1>
    </div>
    <!-- prettier-ignore -->
    <div class="content">
      <p id="nome">Nome: </p>
      <p id="notas">Notas: </p>
      <p id="media">Média: </p>
      <p id="situacao">Situação: </p>
    </div>
    <script>
      const nome = document.getElementById('nome');
      const notas = document.getElementById('notas');
      const media = document.getElementById('media');
      const situacao = document.getElementById('situacao');

      const aluno = {
        nome: 'Bruno',
        sobrenome: 'Galvão',
        notas: [5, 7, 8, 7, 6],
      };

      const soma = aluno.notas.reduce((acc, curr) => acc + curr, 0);
      const mediaAluno = soma / aluno.notas.length;

      nome.textContent += `${aluno.nome} ${aluno.sobrenome}`;
      notas.textContent += aluno.notas.join(', ');
      media.textContent += mediaAluno.toFixed(1).replace('.', ',');
      situacao.textContent += `${mediaAluno >= 6 ? 'Aprovado' : 'Reprovado'}`;
    </script>
  </body>
</html>
